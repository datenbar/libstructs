name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-test-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: codeberg-medium

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake python3 valgrind

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Generate typed structures
        run: cmake --build build --target generate

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Freestanding safety check
        run: cmake --build build --target freestanding-check
